<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - dingbap</title>
<style>
:root {
  --bg-primary: #0e1117;
  --bg-secondary: #161b22;
  --border: #21262d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --danger: #f85149;
  --danger-bg: rgba(248,81,73,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
svg.icon{width:1em;height:1em;stroke:currentColor;fill:none;flex-shrink:0;display:inline-block;vertical-align:-0.15em}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1.5rem;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56,139,253,.15), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(56,139,253,.06), transparent);
}
.card{
  width:100%;
  max-width:380px;
  background:var(--bg-secondary);
  border:1px solid var(--border);
  border-radius:12px;
  padding:2rem 1.75rem;
  box-shadow:0 16px 48px rgba(0,0,0,.35);
}
.brand{
  display:flex;
  align-items:center;
  gap:.6rem;
  margin-bottom:.35rem;
}
.brand svg.icon{color:var(--accent);width:22px;height:22px}
.brand h1{font-size:1.15rem;font-weight:600}
.sub{color:var(--text-secondary);font-size:.85rem;margin-bottom:1.5rem}
label{display:block;font-size:.78rem;color:var(--text-muted);margin-bottom:.35rem;font-weight:500}
input[type=text],input[type=password]{
  width:100%;
  padding:.65rem .75rem;
  border:1px solid var(--border);
  background:var(--bg-primary);
  color:var(--text-primary);
  border-radius:6px;
  font-size:.9rem;
  font-family:inherit;
  margin-bottom:1rem;
}
input:focus{outline:none;border-color:var(--accent)}
button{
  width:100%;
  padding:.7rem 1rem;
  border:none;
  border-radius:6px;
  background:var(--accent);
  color:#fff;
  font-size:.9rem;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  margin-top:.25rem;
}
button:hover{background:var(--accent-hover)}
button:disabled{opacity:.6;cursor:not-allowed}
button.secondary{background:transparent;border:1px solid var(--border);color:var(--text-secondary);margin-top:.5rem}
button.secondary:hover{color:var(--text-primary);border-color:var(--text-muted)}
.error{
  background:var(--danger-bg);
  color:var(--danger);
  border:1px solid var(--danger);
  border-radius:6px;
  padding:.6rem .75rem;
  font-size:.82rem;
  margin-bottom:1rem;
  display:none;
}
.error.show{display:block}
.footer{margin-top:1.25rem;text-align:center;font-size:.8rem;color:var(--text-muted)}
.footer a{color:var(--accent);text-decoration:none}
.footer a:hover{color:var(--accent-hover)}
.hidden{display:none}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <symbol id="i-hard-drive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/>
  </symbol>
</svg>
<div class="card">
  <div class="brand">
    <svg class="icon" aria-hidden="true"><use href="#i-hard-drive"></use></svg>
    <h1>dingbap</h1>
  </div>
  <p class="sub" id="subtitle">Sign in to continue</p>
  {{if .ProxyAuth}}
  <p class="sub" style="margin-top:-.75rem;margin-bottom:1.25rem;font-size:.8rem">SSO via your reverse proxy is enabled. Local password login remains available as a break-glass option.</p>
  {{end}}
  <div class="error" id="error"></div>
  <form id="loginForm" autocomplete="on">
    <div id="stepPassword">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Sign in</button>
    </div>
    <div id="stepTotp" class="hidden">
      <label for="totpCode">Authenticator code</label>
      <input type="text" id="totpCode" name="totp" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code or recovery code">
      <button type="submit" id="totpBtn">Verify</button>
      <button type="button" class="secondary" id="totpBack">Back</button>
    </div>
  </form>
  {{if .PublicOpen}}
  <p class="footer"><a href="/">Continue without signing in</a></p>
  {{end}}
</div>
<script>

const next = {{printf "%q" .Next}};
const form = document.getElementById('loginForm');
const errEl = document.getElementById('error');
const btn = document.getElementById('submitBtn');
const totpBtn = document.getElementById('totpBtn');
let pendingToken = '';

function showError(msg) {
  errEl.textContent = msg;
  errEl.classList.add('show');
}

function clearError() {
  errEl.classList.remove('show');
}

function goTotpStep(token) {
  pendingToken = token;
  document.getElementById('stepPassword').classList.add('hidden');
  document.getElementById('stepTotp').classList.remove('hidden');
  document.getElementById('subtitle').textContent = 'Enter your authenticator code';
  document.getElementById('totpCode').value = '';
  document.getElementById('totpCode').focus();
}

function goPasswordStep() {
  pendingToken = '';
  document.getElementById('stepTotp').classList.add('hidden');
  document.getElementById('stepPassword').classList.remove('hidden');
  document.getElementById('subtitle').textContent = 'Sign in to continue';
  btn.disabled = false;
  totpBtn.disabled = false;
}

function redirectAfterLogin(data) {
  let dest = next;
  if (!dest || !dest.startsWith('/') || dest.startsWith('//') ||
      (dest.startsWith('/admin') && data.role !== 'admin')) {
    dest = data.role === 'admin' ? '/admin' : '/';
  }
  location.href = dest;
}

document.getElementById('totpBack').addEventListener('click', goPasswordStep);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  if (pendingToken) {
    totpBtn.disabled = true;
    try {
      const res = await fetch('/api/login/totp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pending_token: pendingToken,
          code: document.getElementById('totpCode').value.trim()
        })
      });
      const data = await res.json();
      if (!data.ok) {
        if (data.pending_token) pendingToken = data.pending_token;
        showError(data.error || 'Invalid code');
        totpBtn.disabled = false;
        return;
      }
      redirectAfterLogin(data);
    } catch (_) {
      showError('Could not reach the server');
      totpBtn.disabled = false;
    }
    return;
  }

  btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!data.ok) {
      showError(data.error || 'Sign-in failed');
      btn.disabled = false;
      return;
    }
    if (data.totp_required && data.pending_token) {
      goTotpStep(data.pending_token);
      btn.disabled = false;
      return;
    }
    redirectAfterLogin(data);
  } catch (err) {
    showError('Could not reach the server');
    btn.disabled = false;
  }
});

</script>
</body>
</html>
