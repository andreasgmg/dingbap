# dingbap — self-hosted file archive
#
# First run (creates admin in the volume):
#   export ADMIN_PASS='choose-a-long-random-password'
#   docker compose up -d --build
#
# For real HTTPS, put Caddy/nginx in front and keep COOKIE_SECURE=1.
# For local HTTP-only testing, set COOKIE_SECURE=0.

services:
  dingbap:
    build: .
    image: dingbap:local
    container_name: dingbap
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      # Required only on first boot (empty data volume):
      ADMIN_PASS: ${ADMIN_PASS:?Set ADMIN_PASS in the environment or a .env file}
      VIEWER_USER: ${VIEWER_USER:-}
      VIEWER_PASS: ${VIEWER_PASS:-}
      PUBLIC_OPEN: ${PUBLIC_OPEN:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    volumes:
      - dingbap-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dingbap-data:
