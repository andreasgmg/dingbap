# dingbap — self-hosted file archive
#
# First run (creates admin in the volume):
#   export ADMIN_PASS='choose-a-long-random-password'
#   docker compose up -d --build
#
# For real HTTPS, put Caddy/nginx in front (Secure cookies are on by default).
# TRUST_PROXY defaults to 1 in Compose (proxy overwrites X-Forwarded-For / X-Real-IP).
# Optional SSO: PROXY_AUTH=1 (requires TRUST_PROXY) + create matching local users.
# For unusual plain-HTTP LAN testing only: COOKIE_SECURE=0

services:
  dingbap:
    build: .
    image: dingbap:local
    container_name: dingbap
    restart: unless-stopped
    # Give the process time to drain uploads/zips after SIGTERM (app waits 15s).
    stop_grace_period: 20s
    ports:
      - "8080:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      # Required only on first boot (empty data volume):
      ADMIN_PASS: ${ADMIN_PASS:?Set ADMIN_PASS in the environment or a .env file}
      VIEWER_USER: ${VIEWER_USER:-}
      VIEWER_PASS: ${VIEWER_PASS:-}
      PUBLIC_OPEN: ${PUBLIC_OPEN:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PROXY_AUTH: ${PROXY_AUTH:-0}
      WEBDAV: ${WEBDAV:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    volumes:
      - dingbap-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dingbap-data:
